<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>AMAK Hesabu — Kikokotoo cha Biashara</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --success: #15803d;
      --danger: #dc2626;
      --warn: #b45309;
      --border: #e2e8f0;
    }
    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #f87171;
      --warn: #fbbf24;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .app { max-width: 680px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .brand h1 { margin: 0; font-size: 1.35rem; }
    .brand p { margin: 2px 0 0; font-size: 0.85rem; color: var(--muted); }
    .controls { display: flex; gap: 8px; }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.danger { background: var(--danger); color: #fff; }
    button.small { padding: 6px 10px; font-size: 0.8rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .grid-3 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .grid-3 { grid-template-columns: 1fr; } }
    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 11px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .preview-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 0.92rem;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .stat-label { font-size: 0.8rem; color: var(--muted); }
    .stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
    .recon-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .recon-row > div { flex: 1; min-width: 150px; }
    .status-msg { margin-top: 10px; font-weight: 600; font-size: 0.95rem; }
    .ok { color: var(--success); }
    .err { color: var(--danger); }
    .warn { color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td {
      padding: 9px 6px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .actions-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--bg);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <h1>AMAK Hesabu</h1>
        <p id="subtitle">Kikokotoo cha Bei, Idadi na Usahihi (TZS)</p>
      </div>
      <div class="controls">
        <button class="secondary small" onclick="toggleLang()" id="langBtn">EN</button>
        <button class="secondary small" onclick="toggleTheme()" id="themeBtn">Dark</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabCalcBtn" onclick="switchTab('calc')">Hesabu</button>
      <button class="tab-btn" id="tabHistBtn" onclick="switchTab('history')">Historia (<span id="histCount">0</span>)</button>
    </div>

    <div id="calcTab">
      <div class="card">
        <div class="grid-3">
          <div>
            <label for="itemName" id="lblName">Bidhaa (Si lazima)</label>
            <input type="text" id="itemName" placeholder="Mf. Bearing / Item" />
          </div>
          <div>
            <label for="price" id="lblPrice">Bei (Price - TZS)</label>
            <input type="number" id="price" placeholder="0" step="any" min="0" />
          </div>
          <div>
            <label for="qty" id="lblQty">Idadi (Qty)</label>
            <input type="number" id="qty" placeholder="0" step="any" min="0" />
          </div>
        </div>
        <div class="preview-bar">
          <div><strong id="lblPreview">Jumla ndogo:</strong> <span id="liveSubtotal">0</span> TZS</div>
          <div style="display:flex; gap:8px;">
            <button type="button" onclick="addItem()" id="addBtn">Ongeza (Enter)</button>
            <button type="button" class="secondary" onclick="clearInputs()" id="clearInpBtn">Futa</button>
          </div>
        </div>
        <div id="inputError" class="status-msg err"></div>
      </div>

      <div class="card">
        <div class="stats">
          <div class="stat-box">
            <div class="stat-label" id="lblTotalQty">Jumla ya Idadi</div>
            <div class="stat-value" id="totalQty">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label" id="lblLineCount">Mistari (Items)</div>
            <div class="stat-value" id="lineCount">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label" id="lblGrandTotal">Jumla Kuu (TZS)</div>
            <div class="stat-value" id="grandTotal">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="recon-row">
          <div>
            <label for="reconMode" id="lblReconMode">Kagua Accuracy Kwa</label>
            <select id="reconMode" onchange="checkAccuracy()">
              <option value="cash">Pesa Halisi / Cash (TZS)</option>
              <option value="qty">Idadi Halisi / Stock Qty</option>
            </select>
          </div>
          <div>
            <label for="actualVal" id="lblActualVal">Kiasi / Idadi Halisi</label>
            <input type="number" id="actualVal" placeholder="Weka kiasi halisi" step="any" oninput="checkAccuracy()" />
          </div>
        </div>
        <div id="accuracyResult" class="status-msg ok">100% — Weka kiasi halisi kukagua tofauti (variance).</div>
      </div>

      <div class="card">
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th id="thItem">Bidhaa</th>
                <th id="thPrice">Bei</th>
                <th id="thQty">Idadi</th>
                <th id="thSub">Jumla Ndogo</th>
                <th id="thAct">Hatua</th>
              </tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
          </table>
        </div>

        <div class="actions-bar">
          <button type="button" onclick="saveSession()" id="saveBtn">Hifadhi Historia</button>
          <button type="button" class="secondary" onclick="copyWhatsApp()" id="waBtn">Nakili WhatsApp</button>
          <button type="button" class="secondary" onclick="exportCSV()" id="csvBtn">Pakua CSV</button>
          <button type="button" class="danger" onclick="resetSession()" id="resetBtn">Futa Zote</button>
        </div>
        <div id="actionMsg" class="status-msg ok"></div>
      </div>
    </div>

    <div id="historyTab" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="margin:0;" id="histTitle">Historia ya Hesabu Zilizohifadhiwa</h3>
          <button type="button" class="danger small" onclick="clearHistory()" id="clearHistBtn">Futa Historia</button>
        </div>
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "amak_hesabu_state_v1";
    const HIST_KEY = "amak_hesabu_history_v1";

    let lang = "sw";
    let items = [];
    let history = [];

    const i18n = {
      sw: {
        subtitle: "Kikokotoo cha Bei, Idadi na Usahihi (TZS)",
        tabCalc: "Hesabu",
        tabHist: "Historia",
        lblName: "Bidhaa (Si lazima)",
        lblPrice: "Bei (Price - TZS)",
        lblQty: "Idadi (Qty)",
        lblPreview: "Jumla ndogo:",
        addBtn: "Ongeza (Enter)",
        clearInpBtn: "Futa",
        lblTotalQty: "Jumla ya Idadi",
        lblLineCount: "Mistari (Items)",
        lblGrandTotal: "Jumla Kuu (TZS)",
        lblReconMode: "Kagua Accuracy Kwa",
        lblActualVal: "Kiasi / Idadi Halisi",
        thItem: "Bidhaa",
        thPrice: "Bei",
        thQty: "Idadi",
        thSub: "Jumla Ndogo",
        thAct: "Hatua",
        saveBtn: "Hifadhi Historia",
        waBtn: "Nakili WhatsApp",
        csvBtn: "Pakua CSV",
        resetBtn: "Futa Zote",
        histTitle: "Historia ya Hesabu Zilizohifadhiwa",
        clearHistBtn: "Futa Historia",
        errInput: "Weka Bei >= 0 na Idadi > 0.",
        savedMsg: "Hesabu zimehifadhiwa kwenye Historia.",
        copiedMsg: "Muhtasari umenakiliwa kwa ajili ya WhatsApp.",
        noHist: "Hakuna historia iliyohifadhiwa bado."
      },
      en: {
        subtitle: "Price, Quantity & Accuracy Calculator (TZS)",
        tabCalc: "Calculator",
        tabHist: "History",
        lblName: "Item (Optional)",
        lblPrice: "Price (TZS)",
        lblQty: "Quantity (Qty)",
        lblPreview: "Subtotal:",
        addBtn: "Add (Enter)",
        clearInpBtn: "Clear",
        lblTotalQty: "Total Quantity",
        lblLineCount: "Line Items",
        lblGrandTotal: "Grand Total (TZS)",
        lblReconMode: "Check Accuracy By",
        lblActualVal: "Actual Cash / Qty",
        thItem: "Item",
        thPrice: "Price",
        thQty: "Qty",
        thSub: "Subtotal",
        thAct: "Action",
        saveBtn: "Save to History",
        waBtn: "Copy WhatsApp",
        csvBtn: "Export CSV",
        resetBtn: "Reset All",
        histTitle: "Saved Calculation Sessions",
        clearHistBtn: "Clear History",
        errInput: "Enter Price >= 0 and Quantity > 0.",
        savedMsg: "Session saved to History.",
        copiedMsg: "Summary copied for WhatsApp.",
        noHist: "No saved sessions yet."
      }
    };

    function mulExact(a, b) {
      return Math.round((Number(a) * Number(b) + Number.EPSILON) * 100) / 100;
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
    }

    function applyLang() {
      const t = i18n[lang];
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("tabCalcBtn").textContent = t.tabCalc;
      document.getElementById("tabHistBtn").innerHTML = `${t.tabHist} (<span id="histCount">${history.length}</span>)`;
      document.getElementById("lblName").textContent = t.lblName;
      document.getElementById("lblPrice").textContent = t.lblPrice;
      document.getElementById("lblQty").textContent = t.lblQty;
      document.getElementById("lblPreview").textContent = t.lblPreview;
      document.getElementById("addBtn").textContent = t.addBtn;
      document.getElementById("clearInpBtn").textContent = t.clearInpBtn;
      document.getElementById("lblTotalQty").textContent = t.lblTotalQty;
      document.getElementById("lblLineCount").textContent = t.lblLineCount;
      document.getElementById("lblGrandTotal").textContent = t.lblGrandTotal;
      document.getElementById("lblReconMode").textContent = t.lblReconMode;
      document.getElementById("lblActualVal").textContent = t.lblActualVal;
      document.getElementById("thItem").textContent = t.thItem;
      document.getElementById("thPrice").textContent = t.thPrice;
      document.getElementById("thQty").textContent = t.thQty;
      document.getElementById("thSub").textContent = t.thSub;
      document.getElementById("thAct").textContent = t.thAct;
      document.getElementById("saveBtn").textContent = t.saveBtn;
      document.getElementById("waBtn").textContent = t.waBtn;
      document.getElementById("csvBtn").textContent = t.csvBtn;
      document.getElementById("resetBtn").textContent = t.resetBtn;
      document.getElementById("histTitle").textContent = t.histTitle;
      document.getElementById("clearHistBtn").textContent = t.clearHistBtn;
      document.getElementById("langBtn").textContent = lang === "sw" ? "EN" : "SW";
      renderHistory();
      checkAccuracy();
    }

    function toggleLang() {
      lang = lang === "sw" ? "en" : "sw";
      applyLang();
      persist();
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      document.getElementById("themeBtn").textContent = isDark ? "Light" : "Dark";
      persist();
    }

    function switchTab(tab) {
      const isCalc = tab === "calc";
      document.getElementById("calcTab").classList.toggle("hidden", !isCalc);
      document.getElementById("historyTab").classList.toggle("hidden", isCalc);
      document.getElementById("tabCalcBtn").classList.toggle("active", isCalc);
      document.getElementById("tabHistBtn").classList.toggle("active", !isCalc);
    }

    function updatePreview() {
      const p = parseFloat(document.getElementById("price").value);
      const q = parseFloat(document.getElementById("qty").value);
      const sub = (!isNaN(p) && !isNaN(q) && p >= 0 && q > 0) ? mulExact(p, q) : 0;
      document.getElementById("liveSubtotal").textContent = fmt(sub);
    }

    function clearInputs() {
      document.getElementById("itemName").value = "";
      document.getElementById("price").value = "";
      document.getElementById("qty").value = "";
      document.getElementById("inputError").textContent = "";
      updatePreview();
      document.getElementById("price").focus();
    }

    function addItem() {
      const nameEl = document.getElementById("itemName");
      const priceEl = document.getElementById("price");
      const qtyEl = document.getElementById("qty");
      const errEl = document.getElementById("inputError");

      const price = parseFloat(priceEl.value);
      const qty = parseFloat(qtyEl.value);
      const name = nameEl.value.trim();

      if (isNaN(price) || isNaN(qty) || price < 0 || qty <= 0) {
        errEl.textContent = i18n[lang].errInput;
        return;
      }

      errEl.textContent = "";
      items.push({
        id: Date.now() + Math.random(),
        name: name || `#${items.length + 1}`,
        price,
        qty,
        subtotal: mulExact(price, qty)
      });

      clearInputs();
      render();
      persist();
    }

    function deleteItem(id) {
      items = items.filter(it => it.id !== id);
      render();
      persist();
    }

    function getTotals() {
      let totalQty = 0;
      let grandTotal = 0;
      for (const it of items) {
        totalQty = Math.round((totalQty + Number(it.qty)) * 1000) / 1000;
        grandTotal = Math.round((grandTotal + Number(it.subtotal)) * 100) / 100;
      }
      return { totalQty, grandTotal, count: items.length };
    }

    function checkAccuracy() {
      const { totalQty, grandTotal } = getTotals();
      const mode = document.getElementById("reconMode").value;
      const actualRaw = document.getElementById("actualVal").value;
      const out = document.getElementById("accuracyResult");

      if (actualRaw === "" || isNaN(parseFloat(actualRaw))) {
        out.className = "status-msg warn";
        out.textContent = lang === "sw"
          ? "Weka kiasi au idadi halisi ili kuona accuracy na tofauti."
          : "Enter actual cash or quantity to verify accuracy and variance.";
        return;
      }

      const actual = parseFloat(actualRaw);
      const expected = mode === "cash" ? grandTotal : totalQty;
      const diff = Math.round((actual - expected) * 100) / 100;

      if (diff === 0) {
        out.className = "status-msg ok";
        out.textContent = lang === "sw"
          ? `100% Accuracy — Hesabu zinalingana kabisa (${fmt(expected)}).`
          : `100% Accuracy — Exact match (${fmt(expected)}).`;
      } else if (diff > 0) {
        out.className = "status-msg warn";
        out.textContent = lang === "sw"
          ? `Ziada (Surplus): +${fmt(diff)} (Halisi: ${fmt(actual)} vs Hesabu: ${fmt(expected)})`
          : `Surplus: +${fmt(diff)} (Actual: ${fmt(actual)} vs Expected: ${fmt(expected)})`;
      } else {
        out.className = "status-msg err";
        out.textContent = lang === "sw"
          ? `Upungufu (Shortage): ${fmt(diff)} (Halisi: ${fmt(actual)} vs Hesabu: ${fmt(expected)})`
          : `Shortage: ${fmt(diff)} (Actual: ${fmt(actual)} vs Expected: ${fmt(expected)})`;
      }
    }

    function render() {
      const tbody = document.getElementById("ledgerBody");
      tbody.innerHTML = "";

      items.forEach((it, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${escapeHtml(it.name)}</td>
          <td>${fmt(it.price)}</td>
          <td>${fmt(it.qty)}</td>
          <td><strong>${fmt(it.subtotal)}</strong></td>
          <td><button type="button" class="danger small" onclick="deleteItem(${it.id})">X</button></td>
        `;
        tbody.appendChild(tr);
      });

      const { totalQty, grandTotal, count } = getTotals();
      document.getElementById("totalQty").textContent = fmt(totalQty);
      document.getElementById("lineCount").textContent = fmt(count);
      document.getElementById("grandTotal").textContent = fmt(grandTotal);
      checkAccuracy();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function saveSession() {
      if (!items.length) return;
      const { totalQty, grandTotal, count } = getTotals();
      history.unshift({
        id: Date.now(),
        date: new Date().toLocaleString(),
        count,
        totalQty,
        grandTotal,
        items: [...items]
      });
      renderHistory();
      persist();
      showActionMsg(i18n[lang].savedMsg);
    }

    function renderHistory() {
      const box = document.getElementById("historyList");
      document.getElementById("histCount").textContent = history.length;
      if (!history.length) {
        box.innerHTML = `<p style="color:var(--muted);">${i18n[lang].noHist}</p>`;
        return;
      }
      box.innerHTML = history.map(h => `
        <div class="history-item">
          <div><strong>${escapeHtml(h.date)}</strong></div>
          <div>${i18n[lang].lblLineCount}: ${fmt(h.count)} | ${i18n[lang].lblTotalQty}: ${fmt(h.totalQty)}</div>
          <div><strong>${i18n[lang].lblGrandTotal}: ${fmt(h.grandTotal)} TZS</strong></div>
          <div style="margin-top:8px;">
            <button type="button" class="secondary small" onclick="loadSession(${h.id})">Load</button>
          </div>
        </div>
      `).join("");
    }

    function loadSession(id) {
      const found = history.find(h => h.id === id);
      if (!found) return;
      items = found.items.map(x => ({ ...x, id: Date.now() + Math.random() }));
      render();
      persist();
      switchTab("calc");
    }

    function clearHistory() {
      history = [];
      renderHistory();
      persist();
    }

    function copyWhatsApp() {
      const { totalQty, grandTotal, count } = getTotals();
      const lines = items.map((it, i) => `${i + 1}. ${it.name}: ${fmt(it.price)} x ${fmt(it.qty)} = ${fmt(it.subtotal)}`);
      const text = [
        `*AMAK Hesabu Summary*`,
        ...lines,
        `-------------------`,
        `Items: ${fmt(count)} | Total Qty: ${fmt(totalQty)}`,
        `*Grand Total: ${fmt(grandTotal)} TZS*`
      ].join("\n");

      navigator.clipboard?.writeText(text).catch(() => {});
      showActionMsg(i18n[lang].copiedMsg);
    }

    function exportCSV() {
      const rows = [["#", "Item", "Price", "Qty", "Subtotal"]];
      items.forEach((it, i) => rows.push([i + 1, it.name, it.price, it.qty, it.subtotal]));
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "amak_hesabu.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetSession() {
      items = [];
      document.getElementById("actualVal").value = "";
      render();
      persist();
    }

    function showActionMsg(msg) {
      const el = document.getElementById("actionMsg");
      el.textContent = msg;
      setTimeout(() => { el.textContent = ""; }, 3000);
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        lang,
        dark: document.body.classList.contains("dark"),
        items
      }));
      localStorage.setItem(HIST_KEY, JSON.stringify(history));
    }

    function restore() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        if (raw.lang === "en" || raw.lang === "sw") lang = raw.lang;
        if (raw.dark) {
          document.body.classList.add("dark");
          document.getElementById("themeBtn").textContent = "Light";
        }
        if (Array.isArray(raw.items)) items = raw.items;
        const hRaw = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
        if (Array.isArray(hRaw)) history = hRaw;
      } catch (e) {}
      applyLang();
      render();
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    document.getElementById("price").addEventListener("input", updatePreview);
    document.getElementById("qty").addEventListener("input", updatePreview);

    document.getElementById("price").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("qty").focus();
      }
    });

    document.getElementById("qty").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        addItem();
      }
    });

    restore();
  </script>
</body>
</html>
