<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>AMAK Hesabu — Kikokotoo na Risiti</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --success: #15803d;
      --danger: #dc2626;
      --warn: #b45309;
      --border: #e2e8f0;
    }
    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #f87171;
      --warn: #fbbf24;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .app { max-width: 680px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .brand h1 { margin: 0; font-size: 1.35rem; }
    .brand p { margin: 2px 0 0; font-size: 0.85rem; color: var(--muted); }
    .controls { display: flex; gap: 8px; }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.success { background: var(--success); color: #fff; }
    button.danger { background: var(--danger); color: #fff; }
    button.small { padding: 6px 10px; font-size: 0.8rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    @media (max-width: 560px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 11px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .preview-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 0.92rem;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .stat-label { font-size: 0.8rem; color: var(--muted); }
    .stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
    .recon-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .recon-row > div { flex: 1; min-width: 150px; }
    .status-msg { margin-top: 10px; font-weight: 600; font-size: 0.95rem; }
    .ok { color: var(--success); }
    .err { color: var(--danger); }
    .warn { color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td {
      padding: 9px 6px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .actions-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .paper-select { width: auto; min-width: 175px; padding: 9px 10px; font-size: 0.9rem; }
    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--bg);
    }
    .hidden { display: none; }

    /* Receipt Modal */
    .rcpt-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
      overflow-y: auto;
    }
    .rcpt-sheet {
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      max-width: 100%;
    }
    .rcpt-sheet.size-58mm {
      width: 230px;
      padding: 12px 10px;
      font-size: 11px;
    }
    .rcpt-sheet.size-a5 {
      width: 460px;
      padding: 18px 16px;
      font-size: 12.5px;
    }
    .rcpt-center { text-align: center; }
    .rcpt-brand { font-weight: 800; letter-spacing: 0.5px; }
    .size-58mm .rcpt-brand { font-size: 16px; }
    .size-a5 .rcpt-brand { font-size: 21px; }
    .rcpt-sub { color: #475569; margin-top: 2px; }
    .size-58mm .rcpt-sub { font-size: 9.5px; }
    .size-a5 .rcpt-sub { font-size: 11px; }
    .rcpt-title { font-weight: 700; margin-top: 6px; }
    .rcpt-hr { border-top: 1px solid #0f172a; margin: 7px 0; }
    .rcpt-hr-dash { border-top: 1px dashed #64748b; margin: 7px 0; }
    .rcpt-meta { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
    .size-58mm .rcpt-meta { font-size: 10px; flex-wrap: wrap; }
    .size-a5 .rcpt-meta { font-size: 11px; }
    .rcpt-item-58 { margin-bottom: 5px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 4px; }
    .rcpt-item-58-sub { display: flex; justify-content: space-between; font-size: 10px; margin-top: 2px; }
    .rcpt-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .rcpt-table th, .rcpt-table td { padding: 4px 2px; border-bottom: 1px solid #e2e8f0; color: #0f172a; }
    .rcpt-tot-row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
    .rcpt-grand { font-weight: 800; margin-top: 6px; }
    .size-58mm .rcpt-grand { font-size: 13px; }
    .size-a5 .rcpt-grand { font-size: 15px; }
    .rcpt-qr { margin-top: 10px; text-align: center; }
    .rcpt-qr-cap { color: #475569; margin-top: 4px; }
    .size-58mm .rcpt-qr-cap { font-size: 9px; }
    .size-a5 .rcpt-qr-cap { font-size: 10.5px; }
    .rcpt-foot { text-align: center; color: #334155; margin-top: 8px; }
    .size-58mm .rcpt-foot { font-size: 9.5px; }
    .size-a5 .rcpt-foot { font-size: 11px; }
    .rcpt-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    .rcpt-fb { text-align: center; font-size: 11px; font-weight: 600; color: #15803d; margin-top: 6px; min-height: 16px; }

    @media print {
      body > .app { display: none !important; }
      .rcpt-overlay {
        position: static !important;
        background: #ffffff !important;
        padding: 0 !important;
        display: block !important;
      }
      .rcpt-sheet {
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      .rcpt-btns, .rcpt-fb { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <h1>AMAK Hesabu</h1>
        <p id="subtitle">Kikokotoo cha Bei, Idadi na Risiti (TZS)</p>
      </div>
      <div class="controls">
        <button class="secondary small" onclick="toggleLang()" id="langBtn">EN</button>
        <button class="secondary small" onclick="toggleTheme()" id="themeBtn">Dark</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabCalcBtn" onclick="switchTab('calc')">Hesabu</button>
      <button class="tab-btn" id="tabHistBtn" onclick="switchTab('history')">Historia (<span id="histCount">0</span>)</button>
    </div>

    <div id="calcTab">
      <div class="card">
        <div class="grid-2">
          <div>
            <label for="customerName" id="lblCust">Jina la Mteja / Risiti (Si lazima)</label>
            <input type="text" id="customerName" placeholder="Mf. Juma / Cash Sale" oninput="persist()" />
          </div>
          <div>
            <label for="bizSub" id="lblBizSub">Maelezo ya Duka (kwenye Risiti)</label>
            <input type="text" id="bizSub" value="AMAK TECHNOLOGY - Kariakoo, Dar es Salaam" oninput="persist()" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="qrCustom" id="lblQrCustom">Link / Taarifa ya QR Code (Si lazima)</label>
            <input type="text" id="qrCustom" placeholder="Acha wazi kutumia muhtasari wa risiti" oninput="persist()" />
          </div>
          <div>
            <label for="itemName" id="lblName">Bidhaa (Si lazima)</label>
            <input type="text" id="itemName" placeholder="Mf. Bearing / Item" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="price" id="lblPrice">Bei (Price - TZS)</label>
            <input type="number" id="price" placeholder="0" step="any" min="0" />
          </div>
          <div>
            <label for="qty" id="lblQty">Idadi (Qty)</label>
            <input type="number" id="qty" placeholder="0" step="any" min="0" />
          </div>
        </div>

        <div class="preview-bar">
          <div><strong id="lblPreview">Jumla ndogo:</strong> <span id="liveSubtotal">0</span> TZS</div>
          <div style="display:flex; gap:8px;">
            <button type="button" onclick="addItem()" id="addBtn">Ongeza (Enter)</button>
            <button type="button" class="secondary" onclick="clearInputs()" id="clearInpBtn">Futa</button>
          </div>
        </div>
        <div id="inputError" class="status-msg err"></div>
      </div>

      <div class="card">
        <div class="stats">
          <div class="stat-box">
            <div class="stat-label" id="lblTotalQty">Jumla ya Idadi</div>
            <div class="stat-value" id="totalQty">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label" id="lblLineCount">Mistari (Items)</div>
            <div class="stat-value" id="lineCount">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label" id="lblGrandTotal">Jumla Kuu (TZS)</div>
            <div class="stat-value" id="grandTotal">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="recon-row">
          <div>
            <label for="reconMode" id="lblReconMode">Kagua Accuracy Kwa</label>
            <select id="reconMode" onchange="checkAccuracy()">
              <option value="cash">Pesa Halisi / Cash (TZS)</option>
              <option value="qty">Idadi Halisi / Stock Qty</option>
            </select>
          </div>
          <div>
            <label for="actualVal" id="lblActualVal">Kiasi / Idadi Halisi</label>
            <input type="number" id="actualVal" placeholder="Weka kiasi halisi" step="any" oninput="checkAccuracy()" />
          </div>
        </div>
        <div id="accuracyResult" class="status-msg ok">100% — Weka kiasi halisi kukagua tofauti (variance).</div>
      </div>

      <div class="card">
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th id="thItem">Bidhaa</th>
                <th id="thPrice">Bei</th>
                <th id="thQty">Idadi</th>
                <th id="thSub">Jumla Ndogo</th>
                <th id="thAct">Hatua</th>
              </tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
          </table>
        </div>

        <div class="actions-bar">
          <select id="paperSize" class="paper-select" onchange="persist()" aria-label="Receipt Paper Size">
            <option value="58mm">Thermal 58mm (Printer Ndogo)</option>
            <option value="a5">A5 (148 x 210 mm)</option>
          </select>
          <button type="button" class="success" onclick="openReceiptModal()" id="pdfBtn">Fungua Risiti</button>
          <button type="button" onclick="saveSession()" id="saveBtn">Hifadhi Historia</button>
          <button type="button" class="secondary" onclick="copyWhatsApp()" id="waBtn">Nakili WhatsApp</button>
          <button type="button" class="secondary" onclick="exportCSV()" id="csvBtn">Pakua CSV</button>
          <button type="button" class="danger" onclick="resetSession()" id="resetBtn">Futa Zote</button>
        </div>
        <div id="actionMsg" class="status-msg ok"></div>
      </div>
    </div>

    <div id="historyTab" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="margin:0;" id="histTitle">Historia ya Hesabu Zilizohifadhiwa</h3>
          <button type="button" class="danger small" onclick="clearHistory()" id="clearHistBtn">Futa Historia</button>
        </div>
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "amak_hesabu_state_v12";
    const HIST_KEY = "amak_hesabu_history_v1";

    let lang = "sw";
    let items = [];
    let history = [];

    const i18n = {
      sw: {
        subtitle: "Kikokotoo cha Bei, Idadi na Risiti (TZS)",
        tabCalc: "Hesabu",
        tabHist: "Historia",
        lblCust: "Jina la Mteja / Risiti (Si lazima)",
        lblBizSub: "Maelezo ya Duka (kwenye Risiti)",
        lblQrCustom: "Link / Taarifa ya QR Code (Si lazima)",
        lblName: "Bidhaa (Si lazima)",
        lblPrice: "Bei (Price - TZS)",
        lblQty: "Idadi (Qty)",
        lblPreview: "Jumla ndogo:",
        addBtn: "Ongeza (Enter)",
        clearInpBtn: "Futa",
        lblTotalQty: "Jumla ya Idadi",
        lblLineCount: "Mistari (Items)",
        lblGrandTotal: "Jumla Kuu (TZS)",
        lblReconMode: "Kagua Accuracy Kwa",
        lblActualVal: "Kiasi / Idadi Halisi",
        thItem: "Bidhaa",
        thPrice: "Bei",
        thQty: "Idadi",
        thSub: "Jumla Ndogo",
        thAct: "Hatua",
        pdfBtn: "Fungua Risiti",
        saveBtn: "Hifadhi Historia",
        waBtn: "Nakili WhatsApp",
        csvBtn: "Pakua CSV",
        resetBtn: "Futa Zote",
        histTitle: "Historia ya Hesabu Zilizohifadhiwa",
        clearHistBtn: "Futa Historia",
        errInput: "Weka Bei >= 0 na Idadi > 0.",
        emptyReceiptErr: "Ongeza angalau bidhaa moja kabla ya kufungua risiti.",
        savedMsg: "Hesabu zimehifadhiwa kwenye Historia.",
        copiedMsg: "Muhtasari umenakiliwa kwa ajili ya WhatsApp.",
        receiptOpenedMsg: "Risiti imefunguliwa.",
        noHist: "Hakuna historia iliyohifadhiwa bado."
      },
      en: {
        subtitle: "Price, Quantity & Receipt (TZS)",
        tabCalc: "Calculator",
        tabHist: "History",
        lblCust: "Customer / Receipt Name (Optional)",
        lblBizSub: "Business Subtitle (on Receipt)",
        lblQrCustom: "Custom QR Code Link / Text (Optional)",
        lblName: "Item (Optional)",
        lblPrice: "Price (TZS)",
        lblQty: "Quantity (Qty)",
        lblPreview: "Subtotal:",
        addBtn: "Add (Enter)",
        clearInpBtn: "Clear",
        lblTotalQty: "Total Quantity",
        lblLineCount: "Line Items",
        lblGrandTotal: "Grand Total (TZS)",
        lblReconMode: "Check Accuracy By",
        lblActualVal: "Actual Cash / Qty",
        thItem: "Item",
        thPrice: "Price",
        thQty: "Qty",
        thSub: "Subtotal",
        thAct: "Action",
        pdfBtn: "Open Receipt",
        saveBtn: "Save to History",
        waBtn: "Copy WhatsApp",
        csvBtn: "Export CSV",
        resetBtn: "Reset All",
        histTitle: "Saved Calculation Sessions",
        clearHistBtn: "Clear History",
        errInput: "Enter Price >= 0 and Quantity > 0.",
        emptyReceiptErr: "Add at least one item before opening a receipt.",
        savedMsg: "Session saved to History.",
        copiedMsg: "Summary copied for WhatsApp.",
        receiptOpenedMsg: "Receipt opened.",
        noHist: "No saved sessions yet."
      }
    };

    function mulExact(a, b) {
      return Math.round((Number(a) * Number(b) + Number.EPSILON) * 100) / 100;
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
    }

    function applyLang() {
      const t = i18n[lang];
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("tabCalcBtn").textContent = t.tabCalc;
      document.getElementById("tabHistBtn").innerHTML = `${t.tabHist} (<span id="histCount">${history.length}</span>)`;
      document.getElementById("lblCust").textContent = t.lblCust;
      document.getElementById("lblBizSub").textContent = t.lblBizSub;
      document.getElementById("lblQrCustom").textContent = t.lblQrCustom;
      document.getElementById("lblName").textContent = t.lblName;
      document.getElementById("lblPrice").textContent = t.lblPrice;
      document.getElementById("lblQty").textContent = t.lblQty;
      document.getElementById("lblPreview").textContent = t.lblPreview;
      document.getElementById("addBtn").textContent = t.addBtn;
      document.getElementById("clearInpBtn").textContent = t.clearInpBtn;
      document.getElementById("lblTotalQty").textContent = t.lblTotalQty;
      document.getElementById("lblLineCount").textContent = t.lblLineCount;
      document.getElementById("lblGrandTotal").textContent = t.lblGrandTotal;
      document.getElementById("lblReconMode").textContent = t.lblReconMode;
      document.getElementById("lblActualVal").textContent = t.lblActualVal;
      document.getElementById("thItem").textContent = t.thItem;
      document.getElementById("thPrice").textContent = t.thPrice;
      document.getElementById("thQty").textContent = t.thQty;
      document.getElementById("thSub").textContent = t.thSub;
      document.getElementById("thAct").textContent = t.thAct;
      document.getElementById("pdfBtn").textContent = t.pdfBtn;
      document.getElementById("saveBtn").textContent = t.saveBtn;
      document.getElementById("waBtn").textContent = t.waBtn;
      document.getElementById("csvBtn").textContent = t.csvBtn;
      document.getElementById("resetBtn").textContent = t.resetBtn;
      document.getElementById("histTitle").textContent = t.histTitle;
      document.getElementById("clearHistBtn").textContent = t.clearHistBtn;
      document.getElementById("langBtn").textContent = lang === "sw" ? "EN" : "SW";
      renderHistory();
      checkAccuracy();
    }

    function toggleLang() {
      lang = lang === "sw" ? "en" : "sw";
      applyLang();
      persist();
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      document.getElementById("themeBtn").textContent = isDark ? "Light" : "Dark";
      persist();
    }

    function switchTab(tab) {
      const isCalc = tab === "calc";
      document.getElementById("calcTab").classList.toggle("hidden", !isCalc);
      document.getElementById("historyTab").classList.toggle("hidden", isCalc);
      document.getElementById("tabCalcBtn").classList.toggle("active", isCalc);
      document.getElementById("tabHistBtn").classList.toggle("active", !isCalc);
    }

    function updatePreview() {
      const p = parseFloat(document.getElementById("price").value);
      const q = parseFloat(document.getElementById("qty").value);
      const sub = (!isNaN(p) && !isNaN(q) && p >= 0 && q > 0) ? mulExact(p, q) : 0;
      document.getElementById("liveSubtotal").textContent = fmt(sub);
    }

    function clearInputs() {
      document.getElementById("itemName").value = "";
      document.getElementById("price").value = "";
      document.getElementById("qty").value = "";
      document.getElementById("inputError").textContent = "";
      updatePreview();
      document.getElementById("price").focus();
    }

    function addItem() {
      const nameEl = document.getElementById("itemName");
      const priceEl = document.getElementById("price");
      const qtyEl = document.getElementById("qty");
      const errEl = document.getElementById("inputError");

      const price = parseFloat(priceEl.value);
      const qty = parseFloat(qtyEl.value);
      const name = nameEl.value.trim();

      if (isNaN(price) || isNaN(qty) || price < 0 || qty <= 0) {
        errEl.textContent = i18n[lang].errInput;
        return;
      }

      errEl.textContent = "";
      items.push({
        id: Date.now() + Math.random(),
        name: name || `#${items.length + 1}`,
        price,
        qty,
        subtotal: mulExact(price, qty)
      });

      clearInputs();
      render();
      persist();
    }

    function deleteItem(id) {
      items = items.filter(it => it.id !== id);
      render();
      persist();
    }

    function getTotals() {
      let totalQty = 0;
      let grandTotal = 0;
      for (const it of items) {
        totalQty = Math.round((totalQty + Number(it.qty)) * 1000) / 1000;
        grandTotal = Math.round((grandTotal + Number(it.subtotal)) * 100) / 100;
      }
      return { totalQty, grandTotal, count: items.length };
    }

    function checkAccuracy() {
      const { totalQty, grandTotal } = getTotals();
      const mode = document.getElementById("reconMode").value;
      const actualRaw = document.getElementById("actualVal").value;
      const out = document.getElementById("accuracyResult");

      if (actualRaw === "" || isNaN(parseFloat(actualRaw))) {
        out.className = "status-msg warn";
        out.textContent = lang === "sw"
          ? "Weka kiasi au idadi halisi ili kuona accuracy na tofauti."
          : "Enter actual cash or quantity to verify accuracy and variance.";
        return;
      }

      const actual = parseFloat(actualRaw);
      const expected = mode === "cash" ? grandTotal : totalQty;
      const diff = Math.round((actual - expected) * 100) / 100;

      if (diff === 0) {
        out.className = "status-msg ok";
        out.textContent = lang === "sw"
          ? `100% Accuracy — Hesabu zinalingana kabisa (${fmt(expected)}).`
          : `100% Accuracy — Exact match (${fmt(expected)}).`;
      } else if (diff > 0) {
        out.className = "status-msg warn";
        out.textContent = lang === "sw"
          ? `Ziada (Surplus): +${fmt(diff)} (Halisi: ${fmt(actual)} vs Hesabu: ${fmt(expected)})`
          : `Surplus: +${fmt(diff)} (Actual: ${fmt(actual)} vs Expected: ${fmt(expected)})`;
      } else {
        out.className = "status-msg err";
        out.textContent = lang === "sw"
          ? `Upungufu (Shortage): ${fmt(diff)} (Halisi: ${fmt(actual)} vs Hesabu: ${fmt(expected)})`
          : `Shortage: ${fmt(diff)} (Actual: ${fmt(actual)} vs Expected: ${fmt(expected)})`;
      }
    }

    function render() {
      const tbody = document.getElementById("ledgerBody");
      tbody.innerHTML = "";

      items.forEach((it, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${escapeHtml(it.name)}</td>
          <td>${fmt(it.price)}</td>
          <td>${fmt(it.qty)}</td>
          <td><strong>${fmt(it.subtotal)}</strong></td>
          <td><button type="button" class="danger small" onclick="deleteItem(${it.id})">X</button></td>
        `;
        tbody.appendChild(tr);
      });

      const { totalQty, grandTotal, count } = getTotals();
      document.getElementById("totalQty").textContent = fmt(totalQty);
      document.getElementById("lineCount").textContent = fmt(count);
      document.getElementById("grandTotal").textContent = fmt(grandTotal);
      checkAccuracy();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function buildQrSvgMarkup(qrPayload, pxSize) {
      if (typeof qrcode !== "function") return "";
      try {
        const qr = qrcode(0, "M");
        qr.addData(qrPayload);
        qr.make();
        const count = qr.getModuleCount();
        let rects = "";
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="#000"/>`;
            }
          }
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${count} ${count}" width="${pxSize}" height="${pxSize}" style="display:block;margin:0 auto;background:#fff;padding:4px;border:1px solid #e2e8f0;">${rects}</svg>`;
      } catch (e) {
        return "";
      }
    }

    function buildReceiptPlainText(rcptNo, cust, bizSub, now, totalQty, grandTotal) {
      const lines = items.map((it, i) => `${i + 1}. ${it.name}: ${fmt(it.price)} x ${fmt(it.qty)} = ${fmt(it.subtotal)}`);
      return [
        `AMAK`,
        `${bizSub}`,
        `Risiti Na.: ${rcptNo}`,
        `Mteja: ${cust}`,
        `Tarehe: ${now.toLocaleDateString()}`,
        `-------------------`,
        ...lines,
        `-------------------`,
        `Jumla Idadi: ${fmt(totalQty)}`,
        `JUMLA KUU (TZS): ${fmt(grandTotal)}`,
        `Asante kwa kufanya biashara na AMAK!`
      ].join("\n");
    }

    function closeReceiptModal() {
      const modal = document.getElementById("receiptModal");
      if (modal) modal.remove();
    }

    function triggerReceiptPrint() {
      const fb = document.getElementById("rcptFeedback");
      try {
        window.print();
        if (fb) fb.textContent = lang === "sw" ? "Kama dirisha la print halifunguki kwenye app, tumia 'Share / Copy'." : "If print dialog does not open in app, use 'Share / Copy'.";
      } catch (e) {
        if (fb) fb.textContent = lang === "sw" ? "Tumia 'Share / Copy' kutuma au kuhifadhi risiti." : "Use 'Share / Copy' to send or save receipt.";
      }
    }

    function shareOrCopyReceipt(text) {
      const fb = document.getElementById("rcptFeedback");
      if (navigator.share) {
        navigator.share({
          title: "AMAK Receipt",
          text
        }).then(() => {
          if (fb) fb.textContent = lang === "sw" ? "Risiti imetumwa / kusharewa." : "Receipt shared.";
        }).catch(() => {
          copyTextFallback(text, fb);
        });
      } else {
        copyTextFallback(text, fb);
      }
    }

    function copyTextFallback(text, fb) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          if (fb) fb.textContent = lang === "sw" ? "Risiti imenakiliwa." : "Receipt copied.";
        }).catch(() => {
          if (fb) fb.textContent = lang === "sw" ? "Tumia 'Nakili WhatsApp' kwenye ukurasa mkuu." : "Use 'Copy WhatsApp' on main screen.";
        });
      }
    }

    function openReceiptModal() {
      const t = i18n[lang];
      if (!items.length) {
        document.getElementById("inputError").textContent = t.emptyReceiptErr;
        return;
      }
      document.getElementById("inputError").textContent = "";
      closeReceiptModal();

      const paper = document.getElementById("paperSize").value;
      const is58 = paper === "58mm";
      const cust = document.getElementById("customerName").value.trim() || (lang === "sw" ? "Mteja wa Kawaida" : "Walk-in Customer");
      const bizSub = document.getElementById("bizSub").value.trim() || "AMAK TECHNOLOGY - Kariakoo, Dar es Salaam";
      const customQr = document.getElementById("qrCustom").value.trim();
      const now = new Date();
      const rcptNo = "AMAK-" + String(now.getFullYear()).slice(-2) +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") + "-" +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0");

      const { totalQty, grandTotal } = getTotals();
      const qrPayload = customQr || `AMAK|No:${rcptNo}|Cust:${cust}|Qty:${totalQty}|Total:${grandTotal} TZS|Date:${now.toLocaleDateString()}`;
      const qrSvg = buildQrSvgMarkup(qrPayload, is58 ? 84 : 104);
      const plainText = buildReceiptPlainText(rcptNo, cust, bizSub, now, totalQty, grandTotal);

      const itemsHtml = is58
        ? `<div style="margin-top:6px;">${items.map((it, idx) => `
            <div class="rcpt-item-58">
              <div style="font-weight:700;">${idx + 1}. ${escapeHtml(it.name)}</div>
              <div class="rcpt-item-58-sub">
                <span>${fmt(it.price)} x ${fmt(it.qty)}</span>
                <strong>${fmt(it.subtotal)}</strong>
              </div>
            </div>
          `).join("")}</div>`
        : `<table class="rcpt-table">
            <thead>
              <tr>
                <th style="text-align:left;">#</th>
                <th style="text-align:left;">${lang === "sw" ? "Bidhaa" : "Item"}</th>
                <th style="text-align:right;">${lang === "sw" ? "Bei" : "Price"}</th>
                <th style="text-align:right;">${lang === "sw" ? "Idadi" : "Qty"}</th>
                <th style="text-align:right;">${lang === "sw" ? "Jumla" : "Total"}</th>
              </tr>
            </thead>
            <tbody>${items.map((it, idx) => `
              <tr>
                <td>${idx + 1}</td>
                <td>${escapeHtml(it.name)}</td>
                <td style="text-align:right;">${fmt(it.price)}</td>
                <td style="text-align:right;">${fmt(it.qty)}</td>
                <td style="text-align:right;"><strong>${fmt(it.subtotal)}</strong></td>
              </tr>
            `).join("")}</tbody>
          </table>`;

      const overlay = document.createElement("div");
      overlay.id = "receiptModal";
      overlay.className = "rcpt-overlay";
      overlay.innerHTML = `
        <div class="rcpt-sheet ${is58 ? "size-58mm" : "size-a5"}">
          <div class="rcpt-center rcpt-brand">AMAK</div>
          <div class="rcpt-center rcpt-sub">${escapeHtml(bizSub)}</div>
          <div class="rcpt-center rcpt-title">${lang === "sw" ? (is58 ? "RISITI (58mm)" : "RISITI YA MAUZO (A5)") : (is58 ? "RECEIPT (58mm)" : "SALES RECEIPT (A5)")}</div>
          <div class="rcpt-hr"></div>
          <div class="rcpt-meta"><span><strong>${lang === "sw" ? "Mteja:" : "Customer:"}</strong> ${escapeHtml(cust)}</span></div>
          <div class="rcpt-meta"><span><strong>${lang === "sw" ? "Na.:" : "No.:"}</strong> ${escapeHtml(rcptNo)}</span><span>${escapeHtml(now.toLocaleDateString())}</span></div>
          <div class="rcpt-hr-dash"></div>
          ${itemsHtml}
          <div class="rcpt-hr"></div>
          <div class="rcpt-tot-row"><span>${lang === "sw" ? "Jumla Idadi:" : "Total Qty:"}</span><strong>${fmt(totalQty)}</strong></div>
          <div class="rcpt-tot-row rcpt-grand"><span>${lang === "sw" ? "JUMLA KUU (TZS):" : "GRAND TOTAL (TZS):"}</span><span>${fmt(grandTotal)}</span></div>
          ${qrSvg ? `<div class="rcpt-qr">${qrSvg}<div class="rcpt-qr-cap">${lang === "sw" ? "Scan QR kuthibitisha risiti" : "Scan QR to verify receipt"}</div></div>` : ""}
          <div class="rcpt-foot">${lang === "sw" ? "Asante kwa kufanya biashara na AMAK!" : "Thank you for business with AMAK!"}</div>
          <div class="rcpt-btns">
            <button type="button" class="small" onclick="triggerReceiptPrint()">Print</button>
            <button type="button" class="success small" id="rcptShareBtn">Share / Copy</button>
            <button type="button" class="secondary small" onclick="closeReceiptModal()">Close</button>
          </div>
          <div id="rcptFeedback" class="rcpt-fb"></div>
        </div>
      `;

      document.body.appendChild(overlay);
      document.getElementById("rcptShareBtn").addEventListener("click", () => shareOrCopyReceipt(plainText));
      showActionMsg(t.receiptOpenedMsg);
    }

    function saveSession() {
      if (!items.length) return;
      const { totalQty, grandTotal, count } = getTotals();
      const cust = document.getElementById("customerName").value.trim();
      history.unshift({
        id: Date.now(),
        customer: cust,
        date: new Date().toLocaleString(),
        count,
        totalQty,
        grandTotal,
        items: [...items]
      });
      renderHistory();
      persist();
      showActionMsg(i18n[lang].savedMsg);
    }

    function renderHistory() {
      const box = document.getElementById("historyList");
      document.getElementById("histCount").textContent = history.length;
      if (!history.length) {
        box.innerHTML = `<p style="color:var(--muted);">${i18n[lang].noHist}</p>`;
        return;
      }
      box.innerHTML = history.map(h => `
        <div class="history-item">
          <div><strong>${escapeHtml(h.date)}</strong> ${h.customer ? `— ${escapeHtml(h.customer)}` : ""}</div>
          <div>${i18n[lang].lblLineCount}: ${fmt(h.count)} | ${i18n[lang].lblTotalQty}: ${fmt(h.totalQty)}</div>
          <div><strong>${i18n[lang].lblGrandTotal}: ${fmt(h.grandTotal)} TZS</strong></div>
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button type="button" class="secondary small" onclick="loadSession(${h.id})">Load</button>
            <button type="button" class="success small" onclick="loadAndOpenReceipt(${h.id})">Risiti</button>
          </div>
        </div>
      `).join("");
    }

    function loadSession(id) {
      const found = history.find(h => h.id === id);
      if (!found) return;
      items = found.items.map(x => ({ ...x, id: Date.now() + Math.random() }));
      if (found.customer !== undefined) {
        document.getElementById("customerName").value = found.customer;
      }
      render();
      persist();
      switchTab("calc");
    }

    function loadAndOpenReceipt(id) {
      loadSession(id);
      setTimeout(() => openReceiptModal(), 120);
    }

    function clearHistory() {
      history = [];
      renderHistory();
      persist();
    }

    function copyWhatsApp() {
      const { totalQty, grandTotal, count } = getTotals();
      const cust = document.getElementById("customerName").value.trim();
      const lines = items.map((it, i) => `${i + 1}. ${it.name}: ${fmt(it.price)} x ${fmt(it.qty)} = ${fmt(it.subtotal)}`);
      const text = [
        `*AMAK Hesabu Summary*${cust ? ` (${cust})` : ""}`,
        ...lines,
        `-------------------`,
        `Items: ${fmt(count)} | Total Qty: ${fmt(totalQty)}`,
        `*Grand Total: ${fmt(grandTotal)} TZS*`
      ].join("\n");

      navigator.clipboard?.writeText(text).catch(() => {});
      showActionMsg(i18n[lang].copiedMsg);
    }

    function exportCSV() {
      const rows = [["#", "Item", "Price", "Qty", "Subtotal"]];
      items.forEach((it, i) => rows.push([i + 1, it.name, it.price, it.qty, it.subtotal]));
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "amak_hesabu.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetSession() {
      items = [];
      document.getElementById("customerName").value = "";
      document.getElementById("actualVal").value = "";
      render();
      persist();
    }

    function showActionMsg(msg, isErr = false) {
      const el = document.getElementById("actionMsg");
      el.className = isErr ? "status-msg err" : "status-msg ok";
      el.textContent = msg;
      setTimeout(() => { el.textContent = ""; el.className = "status-msg ok"; }, 3500);
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        lang,
        dark: document.body.classList.contains("dark"),
        customerName: document.getElementById("customerName").value,
        bizSub: document.getElementById("bizSub").value,
        qrCustom: document.getElementById("qrCustom").value,
        paperSize: document.getElementById("paperSize").value,
        items
      }));
      localStorage.setItem(HIST_KEY, JSON.stringify(history));
    }

    function restore() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        if (raw.lang === "en" || raw.lang === "sw") lang = raw.lang;
        if (raw.dark) {
          document.body.classList.add("dark");
          document.getElementById("themeBtn").textContent = "Light";
        }
        if (typeof raw.customerName === "string") {
          document.getElementById("customerName").value = raw.customerName;
        }
        if (typeof raw.bizSub === "string" && raw.bizSub.trim()) {
          document.getElementById("bizSub").value = raw.bizSub;
        }
        if (typeof raw.qrCustom === "string") {
          document.getElementById("qrCustom").value = raw.qrCustom;
        }
        if (raw.paperSize === "58mm" || raw.paperSize === "a5") {
          document.getElementById("paperSize").value = raw.paperSize;
        }
        if (Array.isArray(raw.items)) items = raw.items;
        const hRaw = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
        if (Array.isArray(hRaw)) history = hRaw;
      } catch (e) {}
      applyLang();
      render();
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    document.getElementById("price").addEventListener("input", updatePreview);
    document.getElementById("qty").addEventListener("input", updatePreview);

    document.getElementById("price").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("qty").focus();
      }
    });

    document.getElementById("qty").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        addItem();
      }
    });

    restore();
  </script>
</body>
</html>
